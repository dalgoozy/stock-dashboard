name: Financial Data Update (DART)

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python update-financials.py

      - name: Commit & push financials.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add financials.json
          git diff --staged --quiet || git commit -m "auto: financials update $(date +'%Y-%m-%d')"
          git push
