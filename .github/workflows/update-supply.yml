name: Supply Data Update (외국인/기관 수급)

on:
  schedule:
    # 평일 오전 10:30 KST (01:30 UTC) — 장 시작 후 30분
    - cron: '30 1 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pykrx
        run: pip install pykrx

      - name: Fetch supply data
        run: python update-supply.py

      - name: Commit & push supply.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supply.json
          git diff --staged --quiet || git commit -m "auto: supply update $(date +'%Y-%m-%d %H:%M KST')"
          git push
