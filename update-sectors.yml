name: Sector Data Update

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch sector data
        run: python update-sectors.py

      - name: Commit & push sectors.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sectors.json
          git diff --staged --quiet || git commit -m "auto: sectors update $(date +'%Y-%m-%d %H:%M KST')"
          git push
